# Step 2 of the guide. The nine statuses. scripts/board-labels.mjs creates or updates them from this file.
- name: "New reply"
  color: "1D76DB"
  description: "The card exists or a reply landed. Nothing has been sent yet."
- name: "Draft ready"
  color: "FBCA04"
  description: "The draft waits on the card for approval."
- name: "Sent, waiting"
  color: "C5DEF5"
  description: "The email is out. The follow-up sequence runs."
- name: "Booked"
  color: "0E8A16"
  description: "The meeting is on the calendar. Follow-ups stop, the sales rep takes over."
- name: "Call held"
  color: "006B75"
  description: "The calendar or the recording confirms the call."
- name: "Parked"
  color: "BFD4F2"
  description: "The lead said not now, with a date. The AI agent comes back on that date."
- name: "No fit"
  color: "E4E669"
  description: "Below the size floor, refused, or wrong person. The card closes."
- name: "Do not write"
  color: "B60205"
  description: "Set by a person. The AI agent sends nothing to this company until the label is removed."
- name: "Our person is in the thread"
  color: "D93F0B"
  description: "A colleague is talking to this company. The AI agent never writes in that thread again."
